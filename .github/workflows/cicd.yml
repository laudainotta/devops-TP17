name: CI/CD Pipeline - Notes App DevSecOps (Gitleaks, Trivy & Semgrep) v2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# v2: mínimo privilegio para el GITHUB_TOKEN (heredado del TP16)
permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio
  # v2: rutas reales del repo (la guía asumía ./backend en la raíz)
  APP_DIR: guia-10
  # v2: misma versión de Gitleaks en local, en la Action y en el CLI del reporte
  GITLEAKS_VERSION: 8.18.2

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE (Construcción Única de la Imagen)
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./${{ env.APP_DIR }}/backend

      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o build-artifacts/app-image.tar

      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # =========================================================================
  # FASE 2A: GITLEAKS - ANDON CORD (Bloqueante ante Secretos Expuestos)
  # =========================================================================
  gitleaks-andon-cord:
    name: "Fase 2A: Gitleaks - Andon Cord (Secret Detection)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    # v2: la Action lee los commits del PR y comenta hallazgos; necesita este permiso
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del código (Historial completo para análisis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # OBLIGATORIO: Descarga todo el historial de commits

      # v2: id + continue-on-error para que el resumen refleje el resultado real
      - name: Escaneo de Secretos con Gitleaks Action
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
      - name: Resumen de Andon Cord en GitHub
        if: always()
        run: |
          {
            echo "### Auditoría de Secretos (Gitleaks) :key:"
            echo "| Evaluación | Tipo de Control | Resultado |"
            echo "|------------|-----------------|-----------|"
            echo "| **Fuga de Secretos** | **Andon Cord Activo** | ${{ steps.gitleaks.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Andon Cord - Detener la línea si hay secretos
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Andon Cord activado: Gitleaks detectó secretos expuestos en el historial de Git"
          exit 1

  # =========================================================================
  # FASE 2B: GITLEAKS - REPORTE DE INSPECCIÓN (Artifact JSON)
  # =========================================================================
  gitleaks-audit-report:
    name: "Fase 2B: Gitleaks - Reporte e Inspección (Artifacts)"
    runs-on: ubuntu-latest
    needs: [build-and-package, gitleaks-andon-cord]
    # v2: corre aunque el Andon corte, salvo cancelación manual
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout del código (Historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v2: descarga en /tmp para no pisar README.md/LICENSE del repo
      - name: Instalación de Gitleaks CLI
        run: |
          cd /tmp
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # v2: --redact para que el Artifact no vuelva a exponer el secreto en texto plano
      - name: Generar Reporte de Auditoría en JSON
        run: |
          gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json || true

      - name: Publicar Artifact de Auditoría de Secretos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-fuga-secretos-gitleaks
          path: gitleaks-report.json
          retention-days: 14

      # v2: backticks entre comillas simples y salida agrupada hacia el resumen
      - name: Publicar Resumen en $GITHUB_STEP_SUMMARY
        run: |
          {
            echo "### Reporte de Inspección de Secretos (Gitleaks) :clipboard:"
            echo "El informe JSON detallado de auditoría de Git se ha adjuntado como **Artifact**."
            echo "Hallazgos en el historial completo: $(jq length gitleaks-report.json 2>/dev/null || echo 0)"
            echo '```json'
            head -n 30 gitleaks-report.json 2>/dev/null || echo "[]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # =========================================================================
  # FASE 2C: TRIVY - ANDON CORD (heredado del TP16)
  # =========================================================================
  trivy-andon-cord:
    name: "Fase 2C: Trivy - Andon Cord (HIGH/CRITICAL)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Renderizar Helm Chart (TP10B - Sin Falsos Positivos)
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./${{ env.APP_DIR }}/devops-portfolio \
            -f ${{ env.APP_DIR }}/values-prod.yaml > manifests-rendered-prod.yaml
          test -s manifests-rendered-prod.yaml

      - name: Escaneo de Contenedor & SCA (Andon Cord)
        id: scan_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Escaneo de IaC sobre YAML Renderizado (Trivy Config)
        id: scan_iac
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'manifests-rendered-prod.yaml'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Resumen de Andon Cord en GitHub
        if: always()
        run: |
          {
            echo "### Auditoría Bloqueante de Seguridad (Andon Cord) :shield:"
            echo "| Evaluación | Severidades | Resultado |"
            echo "|------------|-------------|-----------|"
            echo "| **Contenedor + SCA** | \`HIGH, CRITICAL\` | ${{ steps.scan_image.outcome }} |"
            echo "| **IaC Renderizado (TP10B)** | \`HIGH, CRITICAL\` | ${{ steps.scan_iac.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Andon Cord - Detener la línea si hubo hallazgos
        if: steps.scan_image.outcome == 'failure' || steps.scan_iac.outcome == 'failure'
        run: |
          echo "::error::Andon Cord activado: hallazgos HIGH/CRITICAL (imagen: ${{ steps.scan_image.outcome }}, IaC: ${{ steps.scan_iac.outcome }})"
          exit 1
  # =========================================================================
  # FASE 2D: TRIVY - REPORTE INFORMATIVO (heredado del TP16)
  # =========================================================================
  trivy-audit-report:
    name: "Fase 2D: Trivy - Reporte e Inspección (LOW/MEDIUM)"
    runs-on: ubuntu-latest
    needs: [build-and-package, trivy-andon-cord]
    if: ${{ !cancelled() && needs.build-and-package.result == 'success' }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Escaneo de Seguridad - Reporte Informativo
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'LOW,MEDIUM'
          output: 'trivy-low-medium-report.txt'

      - name: Publicar Artifact de Vulnerabilidades Menores
        uses: actions/upload-artifact@v4
        with:
          name: reporte-vulnerabilidades-trivy-low-medium
          path: trivy-low-medium-report.txt
          retention-days: 14

      - name: Publicar Resumen en $GITHUB_STEP_SUMMARY
        run: |
          {
            echo "### Reporte de Vulnerabilidades Informativas (LOW/MEDIUM) :clipboard:"
            echo "El reporte completo ha sido adjuntado como **Artifact** descargable en este workflow."
            echo '```text'
            head -n 35 trivy-low-medium-report.txt || echo "No se registraron vulnerabilidades menores."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # =========================================================================
  # FASE 3: RELEASE & DEPLOY (Post-Aprobación de Ciberseguridad)
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 3: Release & Deploy Helm K8s"
    runs-on: ubuntu-latest
    # v2: el release espera a TODOS los controles de la Fase 2 (Gitleaks + Trivy)
    needs: [build-and-package, gitleaks-andon-cord, gitleaks-audit-report, trivy-andon-cord, trivy-audit-report]
    # v2: refs/heads (la guía decía refs/head y el job nunca corría)
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker probada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Continuar despliegue seguro
        run: |
          echo "Iniciando despliegue de Helm Chart '${{ env.HELM_RELEASE_NAME }}' en namespace '${{ env.K8S_NAMESPACE }}'..."
          # helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./${{ env.APP_DIR }}/devops-portfolio -n ${{ env.K8S_NAMESPACE }}
